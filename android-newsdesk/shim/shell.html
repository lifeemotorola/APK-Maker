<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsDesk Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #070B12; color: #E8EFF8;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 46px; box-sizing: border-box;
         display: flex; align-items: center; gap: 8px; padding: 6px 10px;
         background: #0D1321; border-bottom: 1px solid #1E2A3D; z-index: 10; }
  #bar .brand { display: flex; align-items: center; font-size: 14px; font-weight: 700; letter-spacing: .4px; }
  #bar .dot { width: 9px; height: 9px; border-radius: 50%; background: #E01B22; display: inline-block; margin-right: 8px; }
  #bar .spacer { flex: 1; }
  #bar button { background: #1E2A3D; color: #E8EFF8; border: 1px solid #2C3A52; border-radius: 8px;
                padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
  #bar button.on { background: #E01B22; border-color: #E01B22; color: #fff; }
  #bar button svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px;
                    fill: none; stroke: currentColor; stroke-width: 2.2;
                    stroke-linecap: round; stroke-linejoin: round; }

  #views { position: fixed; top: 46px; left: 0; right: 0; bottom: 0; }
  #views iframe { border: 0; width: 100%; height: 100%; display: block; background: #000; }
  body.mode-panel  #fOverlay { display: none; }
  body.mode-overlay #fPanel { display: none; }
</style>
</head>
<body class="mode-panel">
<div id="bar">
  <span class="brand"><span class="dot"></span>NewsDesk Studio</span>
  <span class="spacer"></span>
  <button data-m="panel" class="on"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 11h6M9 15h6"/></svg>Panel</button>
  <button data-m="overlay"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M7 4v16M17 4v16M2.5 12h19"/></svg>Overlay</button>
  <button id="reload" title="Reload both pages"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
</div>
<div id="views">
  <!-- both frames stay alive (display:none keeps them running) so the
       panel and the overlay stay live-synced over the in-page WebSocket shim -->
  <iframe id="fPanel" src="/"></iframe>
  <iframe id="fOverlay" src="/overlay/overlay.html?preview=1"></iframe>
</div>
<script>
  var btns = document.querySelectorAll('#bar button[data-m]');
  function setMode(m) {
    document.body.className = 'mode-' + m;
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].dataset.m === m);
  }
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () { setMode(this.dataset.m); };
  }
  document.getElementById('reload').onclick = function () {
    document.getElementById('fPanel').contentWindow.location.reload();
    document.getElementById('fOverlay').contentWindow.location.reload();
  };
  // phones start on the panel; wide screens get panel (the panel already has
  // its own live preview frame, so the full overlay is one tap away)
  if (window.innerWidth >= 1100) setMode('panel');
</script>
</body>
</html>
