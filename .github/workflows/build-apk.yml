          distribution: temurin
          java-version: '21'

      - name: Validate the offline directory data
        run: node android-marketplace/web/test_data.js

      - name: Build the APK (android-marketplace/build.sh)
        run: ./android-marketplace/build.sh

      - name: Show APK badging
        run: head -30 android-marketplace/app/build/badging.txt

      - name: Verify APK signature
        run: |
          java -jar android/tools/apksigner.jar verify -v Marketplace.apk | head -8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Marketplace-APK
          path: |
            Marketplace.apk
            android-marketplace/app/build/Marketplace-1.0.apk
            android-marketplace/app/build/badging.txt
          if-no-files-found: error
          retention-days: 30

  build-keyfinder-apk:
    name: Build KeyFinder-Player APK
    runs-on: ubuntu-latest
