      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bible-Quiz-APK
          path: |
            Bible-Quiz.apk
            android-biblequiz/app/build/Bible-Quiz-1.3.apk
            android-biblequiz/app/build/badging.txt
          if-no-files-found: error
          retention-days: 30

  build-marketplace-apk:
    name: Build Marketplace APK
    runs-on: ubuntu-latest
