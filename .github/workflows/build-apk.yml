      - name: Set up JDK 21 (for d8 / ecj / apksigner)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the WiFi Cam web shell
        run: node android-wificam/web/test_web.mjs

      - name: Test the computer driver (MJPEG parser)
        run: |
          python3 -m py_compile wificam-driver/wificam_driver.py wificam-driver/test_driver.py
          python3 wificam-driver/test_driver.py

      - name: Build the APK (android-wificam/build.sh)
