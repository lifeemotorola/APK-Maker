  build-wificam-apk:
    name: Build WiFiCam APK + driver test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22 (web shell test)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python 3.11 (driver test)
        uses: actions/setup-python@v7
        with:
