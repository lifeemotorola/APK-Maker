      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up JDK 21 (for d8 / ecj / apksigner)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the player web shell
        run: node android-keyfinder/web/test_web.mjs

      - name: Build the APK (android-keyfinder/build.sh)
        run: ./android-keyfinder/build.sh

      - name: Show APK badging
