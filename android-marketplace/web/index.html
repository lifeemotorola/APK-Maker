<!DOCTYPE html>
<html lang="en" data-theme="market">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ea">
<title>Community Market</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.ico">
<link rel="preload" as="image" href="/img/hero.jpg">
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="toast" role="status" title="Tap to dismiss"></div>
<main id="app"><!-- screens rendered by app.js --></main>

<!-- boot splash: animated storefront emblem, dismissed by app.js on first paint -->
<div id="splash" aria-hidden="true">
  <svg class="splash-icon" viewBox="0 0 108 108">
    <rect x="6" y="6" width="96" height="96" rx="18" fill="#14532D"/>
    <rect x="13" y="13" width="82" height="82" rx="13" fill="none" stroke="#D9A441" stroke-width="2.5"/>
    <path d="M54 14c4 0 7 3 7 7 0 5-7 10-7 10s-7-5-7-10c0-4 3-7 7-7z" fill="#D9A441"/>
    <circle cx="54" cy="21" r="2.6" fill="#14532D"/>
    <path d="M28 52h52v34a4 4 0 0 1-4 4H32a4 4 0 0 1-4-4z" fill="#F5F0E1"/>
    <path d="M24 34h60l-4 14H28z" fill="#D9A441"/>
    <path d="M36 34l2 14M48 34v14M60 34l-2 14M72 34l-2 14" stroke="#14532D" stroke-width="3"/>
    <rect x="47" y="66" width="14" height="24" fill="#14532D"/>
  </svg>
  <div class="splash-title">Community Market</div>
  <div class="splash-rule"><i></i><b></b><i></i></div>
  <div class="splash-sub">Monrovia &middot; 100% offline</div>
</div>

<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
