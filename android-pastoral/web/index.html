<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pastoral — Sermon Studio</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="app">

  <header class="topbar">
    <div class="brand">
      <img src="img/icon.png" alt="Pastoral" class="brand-icon" />
      <div>
        <h1>Pastoral</h1>
        <div class="tagline">sermon studio for pastors</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="home">Home</button>
      <button class="tab" data-view="sermons">Sermons</button>
      <button class="tab" data-view="scripture">Scripture</button>
      <button class="tab" data-view="series">Series</button>
    </nav>
  </header>

  <!-- HOME / dashboard -->
  <section id="view-home" class="view">
    <div class="stats" id="stats"></div>
    <div class="row">
      <button id="newSermonBtn" class="btn primary">+ New sermon</button>
      <button id="genQuickBtn" class="btn">Auto-generate</button>
      <button id="browseScriptureBtn" class="btn">Browse Scripture</button>
    </div>
    <h2 class="sect">Recent sermons</h2>
    <div id="recentList" class="list"></div>
    <h2 class="sect">Backup</h2>
    <div class="row">
      <button id="exportBtn" class="btn">Export all (JSON)</button>
      <button id="importBtn" class="btn">Import JSON</button>
      <button id="themeBtn" class="btn">Theme: dark</button>
    </div>
  </section>

  <!-- SERMON LIST -->
  <section id="view-sermons" class="view hidden">
    <div class="row">
      <input id="searchInput" class="input grow" placeholder="search title, series, scripture..." />
      <select id="seriesFilter" class="input"></select>
    </div>
    <div class="row">
      <button id="newSermonBtn2" class="btn primary">+ New sermon</button>
      <button id="genQuickBtn2" class="btn">Auto-generate</button>
    </div>
    <div id="sermonList" class="list"></div>
  </section>

  <!-- SERMON EDITOR -->
  <section id="view-editor" class="view hidden">
    <h2 class="sect" id="editorTitle">New sermon</h2>
    <div class="genbox">
      <div class="row">
        <input id="fTopic" class="input grow" placeholder="topic or keywords (e.g. hope, forgiveness, shepherd)" />
      </div>
      <div class="row">
        <button id="genBtn" class="btn primary">Auto-generate whole sermon</button>
        <span class="hint">uses the scripture ref below + topic; everything stays editable</span>
      </div>
    </div>
    <label class="fld">Title<input id="fTitle" class="input" placeholder="e.g. The Shepherd's Voice" /></label>
    <div class="row">
      <label class="fld grow">Series<input id="fSeries" class="input" list="seriesList" placeholder="e.g. Psalms series" /><datalist id="seriesList"></datalist></label>
      <label class="fld">Date<input id="fDate" class="input" type="date" /></label>
    </div>
    <div class="row">
      <label class="fld grow">Scripture reference<input id="fRef" class="input" placeholder="e.g. Psalm 23:1-3" /></label>
      <button id="pickRefBtn" class="btn">Pick from Bible</button>
    </div>
    <label class="fld">Key verse<textarea id="fKeyVerse" class="input" rows="2" placeholder="verse text (auto-filled when picked from the Bible)"></textarea></label>
    <label class="fld">Theme / big idea<input id="fTheme" class="input" placeholder="one-sentence theme" /></label>
    <label class="fld">Introduction<textarea id="fIntro" class="input" rows="3"></textarea></label>
    <h2 class="sect">Outline</h2>
    <div id="points"></div>
    <button id="addPointBtn" class="btn">+ Add point</button>
    <label class="fld">Illustration<textarea id="fIllustration" class="input" rows="2"></textarea></label>
    <label class="fld">Application<textarea id="fApplication" class="input" rows="2"></textarea></label>
    <label class="fld">Conclusion<textarea id="fConclusion" class="input" rows="2"></textarea></label>
    <h2 class="sect">Delivery notes</h2>
    <div class="row">
      <label class="fld">Target length (min)<input id="fDuration" class="input" type="number" min="1" max="180" value="30" /></label>
    </div>
    <label class="fld">Reminders<textarea id="fDelivery" class="input" rows="2" placeholder="prayer points, timing cues, slides..."></textarea></label>
    <div class="row">
      <button id="saveSermonBtn" class="btn primary">Save sermon</button>
      <button id="shareSermonBtn" class="btn">Share</button>
      <button id="cancelEditBtn" class="btn">Cancel</button>
    </div>
    <div id="editorMsg" class="msg"></div>
  </section>

  <!-- SCRIPTURE (bundled KJV) -->
  <section id="view-scripture" class="view hidden">
    <div class="row">
      <select id="bookSel" class="input grow"></select>
      <select id="chapterSel" class="input"></select>
    </div>
    <div class="row">
      <input id="verseSearch" class="input grow" placeholder="search all verses (e.g. shepherd, love)..." />
      <button id="verseSearchBtn" class="btn">Search</button>
    </div>
    <div class="row">
      <button id="genFromVerseBtn" class="btn primary">Auto-generate sermon from selected verse</button>
    </div>
    <div id="pickHint" class="hint hidden">Pick a verse to insert into the sermon editor</div>
    <div id="verseList" class="list verses"></div>
  </section>

  <!-- SERIES -->
  <section id="view-series" class="view hidden">
    <div id="seriesList" class="list"></div>
  </section>

  <div id="toast" class="toast hidden"></div>
</main>

<script src="bibles/kjv.js"></script>
<script src="generate.js"></script>
<script src="app.js"></script>
</body>
</html>
